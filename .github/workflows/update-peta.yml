name: Update peta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang library
        run: pip install -r requirements.txt
      - name: Pasang font Arial
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accept-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo apt-get install -y -qq ttf-mscorefonts-installer fonts-liberation || sudo apt-get install -y -qq fonts-liberation
          fc-list | grep -ci arial || true

      - name: Bikin peta web
        run: |
          UKURAN=75x45 python buat_peta.py vektor
          python buat_web.py

      - name: Bikin peta web RW 08 (di /rw08/)
        working-directory: rw08
        run: |
          UKURAN=75x45 python buat_peta.py vektor
          python buat_web.py
          mkdir -p ../web/rw08 && cp -r web/. ../web/rw08/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  banner:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: "."
            nama: banner-pdf
          - folder: rw08
            nama: banner-rw08
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Pasang library
        run: pip install -r requirements.txt
      - name: Pasang font Arial
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accept-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo apt-get install -y -qq ttf-mscorefonts-installer fonts-liberation || sudo apt-get install -y -qq fonts-liberation
          fc-list | grep -ci arial || true
      - name: Bikin banner
        working-directory: ${{ matrix.folder }}
        run: python buat_peta.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nama }}
          path: ${{ matrix.folder }}/output/*.pdf
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
