<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gambar Batas RT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>body{margin:0;font:14px system-ui,sans-serif;display:flex;height:100vh;background:#fbf8ea}
#side{width:310px;padding:12px;overflow:auto;border-right:3px solid #1b6c32}#map{flex:1}
h3{margin:0 0 6px;color:#1b6c32}.rt{padding:8px;margin:5px 0;border:2px solid #ccc;border-radius:8px;cursor:pointer;background:#fff;display:flex;align-items:center;gap:8px}
.rt.on{border-color:#1b6c32;box-shadow:0 0 0 2px #fdbe15}.rt i{width:16px;height:16px;border-radius:4px;display:inline-block}.rt small{margin-left:auto;color:#16a34a;font-weight:700}
button{width:100%;padding:9px;margin-top:6px;font-size:14px;cursor:pointer;border-radius:7px;border:1px solid #1b6c32;background:#fff}
button.p{background:#1b6c32;color:#fff}textarea{width:100%;height:110px;font-size:10px;margin-top:6px}ol{padding-left:18px;margin:4px 0 8px;font-size:13px}
.lbl{background:none;border:none;box-shadow:none;color:#fff;font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000}.lbl:before{display:none}</style></head><body>
<div id="side"><h3>Gambar Batas RT – RW 02</h3>
<ol><li>Pilih RT di bawah.</li><li>Klik titik-titik keliling wilayah RT itu di peta.</li><li>Boleh lewat sedikit keluar garis kuning RW (nanti dipotong otomatis).</li><li>Klik <b>Selesai RT ini</b>, lanjut RT berikutnya.</li></ol>
<div id="list"></div>
<button onclick="undo()">↶ Batal titik terakhir</button><button onclick="hapus()">Hapus gambar RT ini</button>
<button class="p" onclick="selesai()">✔ Selesai RT ini</button><button class="p" onclick="salin()">Salin hasil (kirim ke Claude)</button>
<textarea id="out" placeholder="Hasil muncul di sini"></textarea></div><div id="map"></div>

{"nama": "Pos Kamling RT 12", "lat": -7.8098955, "lon": 110.3490353, "warna": "#be185d"}, {"nama": "Bank Sampah RT 08", "lat": -7.8089608, "lon": 110.3481982, "warna": "#65a30d"}, {"nama": "Bank Sampah RT 12", "lat": -7.8098062, "lon": 110.3492965, "warna": "#65a30d"}];
const RT=[["RT 08","#e11d48"],["RT 09","#2563eb"],["RT 10","#16a34a"],["RT 11","#9333ea"],["RT 12","#ea580c"]].map(([n,c])=>({n,c,pts:[],ly:null,done:false}));
const map=L.map('map',{maxZoom:21});
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:21,maxNativeZoom:19}).addTo(map);
const rw=L.polygon(RW,{color:'#fdbe15',weight:4,fill:false,interactive:false}).addTo(map);map.fitBounds(rw.getBounds(),{padding:[10,10]});
POI.forEach(p=>L.circleMarker([p.lat,p.lon],{radius:6,color:'#fff',weight:2,fillColor:p.warna,fillOpacity:1,interactive:false}).addTo(map)
  .bindTooltip(p.nama,{permanent:true,direction:'right',className:'lbl'}));
let cur=0;
function draw(r){if(r.ly)map.removeLayer(r.ly);if(!r.pts.length){r.ly=null;return}
 r.ly=(r.done?L.polygon(r.pts,{color:r.c,weight:3,fillOpacity:.3}):L.polyline(r.pts,{color:r.c,weight:3,dashArray:'6 4'})).addTo(map);
 if(r.done)r.ly.bindTooltip(r.n,{permanent:true,direction:'center',className:'lbl'});}
function render(){const l=document.getElementById('list');l.innerHTML='';RT.forEach((r,i)=>{const d=document.createElement('div');
 d.className='rt'+(i==cur?' on':'');d.innerHTML=`<i style="background:${r.c}"></i>${r.n}<small>${r.done?'✔ selesai':r.pts.length?r.pts.length+' titik':''}</small>`;
 d.onclick=()=>{cur=i;render()};l.appendChild(d)})}
map.on('click',e=>{const r=RT[cur];if(r.done)return alert(r.n+' sudah selesai. Klik "Hapus gambar RT ini" untuk ulang.');r.pts.push([e.latlng.lat,e.latlng.lng]);draw(r);render()});
function undo(){const r=RT[cur];r.done=false;r.pts.pop();draw(r);render()}
function hapus(){const r=RT[cur];r.pts=[];r.done=false;draw(r);render()}
function selesai(){const r=RT[cur];if(r.pts.length<3)return alert('Minimal 3 titik.');r.done=true;draw(r);const nx=RT.findIndex(x=>!x.done);if(nx>=0)cur=nx;render();salin()}
function salin(){const o={};RT.filter(r=>r.done).forEach(r=>o[r.n]=r.pts.map(([a,b])=>[+a.toFixed(6),+b.toFixed(6)]));
 const t=JSON.stringify(o);document.getElementById('out').value=t;try{navigator.clipboard.writeText(t)}catch(e){}}
render();
